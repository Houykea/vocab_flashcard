<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Vocabulary Flashcards</title>
    <style>
        :root {
            --paper: #F6F1E4;
            --ink: #22271F;
            --ink-soft: #5C5A4E;
            --line: #C9BFA4;
            --gold: #B8862E;
            --gold-dark: #7C5A1E;
            --teal: #1F4B44;
            --teal-light: #E4EFEA;
            --coral: #B54A31;
            --card-bg: #FFFCF4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--paper);
            font-family: 'Georgia', 'Times New Roman', serif;
            color: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 16px 48px;
        }

        .khmer {
            font-family: 'Khmer OS', 'Noto Sans Khmer', 'Khmer UI', sans-serif;
        }

        h1 {
            font-size: 22px;
            font-weight: normal;
            letter-spacing: 0.5px;
            margin: 0 0 2px;
            text-align: center;
        }

        .subtitle {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 13px;
            color: var(--ink-soft);
            margin-bottom: 20px;
            text-align: center;
        }

        .topbar {
            width: 100%;
            max-width: 520px;
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #search {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--card-bg);
            font-size: 13px;
            color: var(--ink);
        }

        #search:focus {
            outline: 1px solid var(--gold);
        }

        .icon-btn {
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--card-bg);
            font-size: 13px;
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--ink);
            cursor: pointer;
        }

        .icon-btn:hover {
            border-color: var(--gold);
        }

        .deck-wrap {
            position: relative;
            width: 100%;
            max-width: 520px;
        }

        .stage {
            position: relative;
            width: 100%;
            max-width: 520px;
            height: 340px;
            perspective: 1400px;
        }

        .card {
            position: absolute;
            inset: 0;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(.4, .2, .2, 1);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--card-bg);
            box-shadow: 0 1px 0 var(--line), 0 6px 16px rgba(70, 60, 30, 0.08);
            display: flex;
            flex-direction: column;
            padding: 26px 30px;
        }

        .face::before {
            content: "";
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            bottom: 14px;
            border: 1px solid var(--line);
            border-radius: 6px;
            pointer-events: none;
        }

        .front {
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .back {
            transform: rotateY(180deg);
            justify-content: flex-start;
            overflow-y: auto;
        }

        .eyebrow {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--gold-dark);
            margin-bottom: 14px;
        }

        .headword {
            font-size: 40px;
            line-height: 1.15;
            color: var(--ink);
        }

        .hint {
            margin-top: 16px;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 12px;
            color: var(--ink-soft);
        }

        .row1 {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .back .headword-small {
            font-size: 22px;
            color: var(--ink);
        }

        .pos {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 11px;
            font-style: normal;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--teal-light);
            color: var(--teal);
            letter-spacing: 0.3px;
        }

        .syn {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 12.5px;
            color: var(--ink-soft);
        }

        .khmer-line {
            font-size: 19px;
            color: var(--coral);
            margin: 8px 0 14px;
        }

        .divider {
            border: none;
            border-top: 1px dashed var(--line);
            margin: 6px 0 12px;
        }

        .ex-label {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 10.5px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }

        .ex {
            font-size: 15px;
            line-height: 1.55;
            margin: 0 0 8px;
            color: var(--ink);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 520px;
            margin-top: 18px;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .nav-btn {
            padding: 9px 16px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: var(--card-bg);
            color: var(--ink);
            font-size: 13px;
            cursor: pointer;
        }

        .nav-btn:hover {
            border-color: var(--gold);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .counter {
            font-size: 13px;
            color: var(--ink-soft);
            text-align: center;
        }

        .progress-track {
            width: 100%;
            max-width: 520px;
            height: 3px;
            background: var(--line);
            border-radius: 2px;
            margin-top: 14px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--gold);
            width: 0%;
            transition: width 0.3s ease;
        }

        .empty {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 13px;
            color: var(--ink-soft);
            text-align: center;
            padding: 60px 20px;
        }
    </style>
</head>

<body>

    <h1>Vocabulary Flashcards</h1>
    <div class="subtitle khmer">អក្សរាវលី &nbsp;·&nbsp; tap a card to flip &nbsp;·&nbsp; <span id="totalCount">75</span>
        words</div>

    <div class="topbar">
        <input type="text" id="search" placeholder="Search a word...">
        <button class="icon-btn" id="shuffleBtn">Shuffle</button>
        <button class="icon-btn" id="resetBtn">Reset order</button>
    </div>

    <div class="deck-wrap">
        <div class="stage" id="stage"></div>
    </div>

    <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="controls">
        <button class="nav-btn" id="prevBtn">&larr; Previous</button>
        <div class="counter" id="counter">1 / 75</div>
        <button class="nav-btn" id="nextBtn">Next &rarr;</button>
    </div>

    <script>
        const DATA = [
            ["bargain", "noun", "deal", "កិច្ចសន្យា; ការចរចាតម្លៃ",

            ["basis", "noun", "foundation", "មូលដ្ឋាន; គ្រឹះ",
                "Trust is the basis of any relationship.", "The report is written on the basis of new evidence."],
            ["beam", "noun", "rafter", "ធ្នឹម",
                "The wooden beam supported the ceiling.", "A steel beam ran across the roof."],
            ["bid", "noun", "offer", "ការដេញថ្លៃ",
                "She made a bid at the auction.", "The construction company submitted the lowest bid."],
            ["blade", "noun", "edge", "ផ្នែកមុត",

            ["bond", "noun", "tie", "ចំណង",
                "The mother and child share a strong bond.", "Years of friendship created an unbreakable bond."],
            ["boundary", "noun", "border", "ព្រំដែន",
                "The fence marks the property boundary.", "The river forms a natural boundary between the two countries."],
            ["bulk", "noun", "mass", "បរិមាណធំ",
                "We buy rice in bulk to save money.", "The bulk of the work is already finished."],
            ["bulletin", "noun", "announcement", "សេចក្ដីជូនដំណឹងខ្លី",
                "The news bulletin provided important updates.", "A weather bulletin warned of the coming storm."],
            ["cargo", "noun", "freight", "ទំនិញដឹកជញ្ជូន",
                "The cargo ship transported valuable electronics.", "Workers unloaded the cargo at the port."],
            ["cast", "verb / noun", "actors / throw", "តួសម្ដែង; បោះចោល",
                "The film has a talented cast.", "He cast a stone into the lake."],
            ["catalog", "noun", "directory", "បញ្ជីរាយនាម",
                "The library catalog contains thousands of books.", "She browsed the furniture catalog online."],
            ["cement", "noun", "mortar", "ស៊ីម៉ងត៍",
                "Cement is essential for construction work.", "Workers mixed cement to lay the foundation."],
            ["chairman", "noun", "president", "ប្រធាន",
                "The chairman opened the meeting.", "She was elected chairman of the committee."],
            ["chimney", "noun", "flue", "បំពង់ផ្សែង",
                "Smoke rose from the brick chimney.", "Birds nested in the old chimney."],
            ["civilization", "noun", "society", "អរិយធម៌",
                "Ancient civilizations left remarkable achievements.", "The rise and fall of civilizations shapes history."],
            ["classify", "verb", "categorize", "ចាត់ថ្នាក់",
                "Scientists classify organisms systematically.", "The documents were classified as confidential."],
            ["clerk", "noun", "assistant", "ស្មៀន",
                "The store clerk was very helpful.", "He worked as a bank clerk for ten years."],
            ["cluster", "noun / verb", "group", "ចង្កោម",
                "A cluster of stars was visible in the telescope.", "People clustered around the accident scene."],
            ["coarse", "adjective", "rough", "រដុប",
                "The fabric had a coarse texture.", "Coarse sand covered the beach."],
            ["coincide", "verb", "overlap", "កើតឡើងស្របគ្នា",
                "My holiday dates coincide with the school break.", "Their opinions rarely coincide."],
            ["colleague", "noun", "coworker", "មិត្តរួមការងារ",
                "I discussed the idea with my colleagues.", "She invited her colleagues to the party."],
            ["collide", "verb", "crash", "បុកគ្នា",
                "The two particles collided at high speed.", "The cars collided at the intersection."],
            ["compact", "adjective", "dense", "តូចចង្អៀត",
                "The kitchen was compact but well-designed.", "He owns a compact car for city driving."],
            ["compatible", "adjective", "suited", "ត្រូវគ្នា",
                "The software is not compatible with older systems.", "The two personalities are highly compatible."],
            ["compensate", "verb", "reimburse", "ផ្តល់សំណង",
                "Victims were compensated for their injuries.", "The company compensated employees for overtime."],
            ["competent", "adjective", "capable", "មានសមត្ថភាព",
                "She is a highly competent manager.", "He proved himself competent in the new role."],
            ["compile", "verb", "assemble", "ចងក្រង",
                "We compiled a list of potential customers.", "The editor compiled the stories into a book."],
            ["compose", "verb", "create", "តែង",
                "Mozart composed his first symphony at age eight.", "She composed a letter to her friend."],
            ["compound", "noun", "mixture", "សមាសធាតុ",
                "Water is a chemical compound of hydrogen and oxygen.", "The factory produces several chemical compounds."],
            ["compromise", "noun / verb", "settlement", "ការសម្របសម្រួល",
                "They reached a compromise after hours of negotiation.", "Neither side was willing to compromise."],
            ["compulsory", "adjective", "mandatory", "ចាំបាច់",
                "English is a compulsory subject in many schools.", "Military service is compulsory in some countries."],
            ["concrete", "adjective", "definite", "ជាក់ស្ដែង",
                "We need concrete evidence before we proceed.", "The building was made of reinforced concrete."],
            ["condense", "verb", "compress", "បង្រួម",
                "Moisture in the air condenses to form rain.", "Please condense the report into two pages."],
            ["confront", "verb", "face", "ប្រឈមមុខ",
                "He decided to confront his accuser.", "She confronted her fears head-on."],
            ["conserve", "verb", "preserve", "អភិរក្ស",
                "We need to conserve our natural resources.", "Turning off lights helps conserve energy."],
            ["consult", "verb", "advise with", "ពិគ្រោះ",
                "You should consult a doctor if symptoms persist.", "He consulted a lawyer before signing."],
            ["content", "adjective", "satisfied", "ពេញចិត្ត",
                "He seemed content with his life.", "She was content to stay home and read."],
            ["converse", "verb", "chat", "សន្ទនា",
                "They conversed in quiet tones.", "It was pleasant to converse with such an interesting person."],
            ["cooperate", "verb", "collaborate", "សហការ",
                "The two countries agreed to cooperate.", "Please cooperate with the investigation."],
            ["cope", "verb", "manage", "ស៊ូទ្រាំ",
                "She struggled to cope with the workload.", "He copes well under pressure."],
            ["corrupt", "adjective", "dishonest", "ពុករលួយ",
                "The corrupt official accepted bribes regularly.", "Corrupt practices undermined public trust."],
            ["corruption", "noun", "dishonesty", "អំពើពុករលួយ",
                "The government promised to fight corruption.", "Corruption weakens a country's institutions."],
            ["costly", "adjective", "expensive", "ថ្លៃថ្នូ",
                "The repairs turned out to be very costly.", "Costly mistakes can ruin a business."],
            ["correspond", "verb", "match", "ស្របគ្នា",
                "Her actions did not correspond with her words.", "The two reports correspond closely."],
            ["coverage", "noun", "reporting", "ការផ្ដល់ព័ត៌មាន",
                "The election received extensive media coverage.", "Her insurance coverage includes dental care."],
            ["credit", "noun", "trust / loan", "កម្ចី; ការទុកចិត្ត",
                "She bought the car on credit.", "He deserves credit for the idea."],
            ["constructive", "adjective", "helpful", "មានស្ថាបនា",
                "He gave constructive feedback on my essay.", "A constructive conversation solved the problem."],
            ["criticism", "noun", "disapproval", "ការរិះគន់",
                "The film received harsh criticism from critics.", "She accepted the criticism gracefully."],
            ["criticize", "verb", "condemn", "រិះគន់",
                "She criticized the plan for being unrealistic.", "Don't criticize others without understanding them."],
            ["cylinder", "noun", "tube", "ស៊ីឡាំង",
                "The engine has six cylinders.", "A cylinder of gas stood in the corner."],
            ["decay", "verb", "rot", "ពុកផុយ",
                "Sugar causes tooth decay over time.", "The old house began to decay."],
            ["deceive", "verb", "mislead", "បន្លំ",
                "He tried to deceive investors with fake reports.", "She would never deceive a friend."],
            ["deed", "noun", "act", "អំពើ",
                "Helping the elderly man was a kind deed.", "Every good deed deserves recognition."],
            ["defect", "noun", "flaw", "ខ្សោយខាត",
                "The car was recalled due to a manufacturing defect.", "The vase had a small defect on its base."],
            ["definite", "adjective", "certain", "ច្បាស់លាស់",
                "We need a definite answer by tomorrow.", "There is no definite date for the meeting yet."],
            ["delicate", "adjective", "fragile", "ប្រណីត",
                "The vase was too delicate to ship safely.", "She has delicate features."],
            ["demand", "noun", "request", "ទាមទារ",
                "Workers made a demand for higher wages.", "Demand for the product increased sharply."],
            ["ambiguity", "noun", "vagueness", "ភាពមិនច្បាស់លាស់",
                "The contract's wording caused ambiguity.", "His answer was full of ambiguity."],
            ["reciprocity", "noun", "mutual exchange", "ទំនាក់ទំនងទៅវិញទៅមក",
                "Trade agreements are based on reciprocity.", "Their friendship grew through reciprocity of kindness."],
            ["obligation", "noun", "duty", "កាតព្វកិច្ច",
                "He felt an obligation to help his family.", "Paying taxes is a legal obligation."],
            ["frugal", "adjective", "thrifty", "សន្សំសំចៃ",
                "She lives a frugal lifestyle to save money.", "They were frugal with their spending during hard times."],
            ["condiment", "noun", "seasoning", "គ្រឿងផ្សំម្ហូបអាហារ",
                "Ketchup is a popular condiment.", "The table had various condiments for the barbecue."],
            ["complimentary", "adjective", "free", "ដោយឥតគិតថ្លៃ",
                "The hotel offered a complimentary breakfast.", "He made complimentary remarks about her work."],
            ["complementary", "adjective", "corresponding", "បំពេញបន្ថែមគ្នា",
                "The two colors are complementary.", "Their skills are complementary to the team."],
            ["complement", "noun / verb", "accompaniment", "ការបំពេញបន្ថែម",
                "The wine was a perfect complement to the meal.", "Good design complements good function."],
            ["carpenter", "noun", "woodworker", "ជាងឈើ",
                "The carpenter built a new table.", "He worked as a carpenter for twenty years."],
            ["occasionally", "adverb", "sometimes", "ម្ដងម្កាល",
                "We occasionally eat out on weekends.", "She occasionally visits her grandparents."],
            ["electroencephalograph", "noun", "EEG machine", "ឧបករណ៍វាស់រលកខួរក្បាល",
                "The doctor used an electroencephalograph to study his brain waves.", "The electroencephalograph showed unusual activity during sleep."],
            ["therapeutic", "adjective", "healing", "ព្យាបាល",
                "Yoga has therapeutic effects on stress.", "The warm bath felt therapeutic after a long day."],
            ["writhing", "verb", "squirming", "រមួលកាយដោយឈឺចាប់",
                "The injured man was writhing in pain.", "She lay writhing on the ground after the fall."],
            ["caressed", "verb", "stroked", "អង្អែល",
                "She caressed her baby's cheek.", "He caressed the cat's fur softly."],
            ["ecstasy", "noun", "bliss", "អំណរដ៏ខ្លាំងក្លា",
                "She screamed in ecstasy when she won the prize.", "The dancers moved in pure ecstasy."],
            ["hypnosis", "noun", "trance", "ការធ្វើឲ្យស្ថិតក្នុងភាពងងុយគេង",
                "He was put under hypnosis to quit smoking.", "Hypnosis can help reduce anxiety in some patients."],
            ["psychoactive", "adjective", "mind-altering", "ជះឥទ្ធិពលលើចិត្ត",
                "Caffeine is a mild psychoactive substance.", "The medication has psychoactive effects."],
            ["eludes", "verb", "evades", "គេចវេស",
                "The answer eludes me completely.", "The criminal eludes capture for years."],
            ["deludes", "verb", "deceives", "បញ្ឆោត",
                "He deludes himself into thinking he is always right.", "Advertising sometimes deludes consumers."]
        ];

        let order = DATA.map((_, i) => i);
        let pos = 0;
        let flipped = false;

        const stage = document.getElementById('stage');
        const counter = document.getElementById('counter');
        const progressFill = document.getElementById('progressFill');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const search = document.getElementById('search');
        document.getElementById('totalCount').textContent = DATA.length;

        function renderCard() {
            stage.innerHTML = '';
            if (order.length === 0) {
                stage.innerHTML = '<div class="empty">No words match your search.</div>';
                counter.textContent = '0 / 0';
                progressFill.style.width = '0%';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }
            prevBtn.disabled = false;
            nextBtn.disabled = false;
            const idx = order[pos];
            const [word, posTag, syn, khmer, ex1, ex2] = DATA[idx];

            const card = document.createElement('div');
            card.className = 'card' + (flipped ? ' flipped' : '');
            card.innerHTML = `
    <div class="face front">
      <div class="eyebrow">tap to reveal</div>
      <div class="headword">${word}</div>
      <div class="hint">part of speech &middot; synonym &middot; Khmer &middot; examples</div>
    </div>
    <div class="face back">
      <div class="row1">
        <span class="headword-small">${word}</span>
        <span class="pos">${posTag}</span>
      </div>
      <div class="syn">synonym: ${syn}</div>
      <div class="khmer-line khmer">${khmer}</div>
      <hr class="divider">
      <div class="ex-label">examples</div>
      <p class="ex">${ex1}</p>
      <p class="ex">${ex2}</p>
    </div>
  `;
            card.addEventListener('click', () => {
                flipped = !flipped;
                card.classList.toggle('flipped');
            });
            stage.appendChild(card);

            counter.textContent = (pos + 1) + ' / ' + order.length;
            progressFill.style.width = ((pos + 1) / order.length * 100) + '%';
        }

        function goNext() {
            if (order.length === 0) return;
            pos = (pos + 1) % order.length;
            flipped = false;
            renderCard();
        }
        function goPrev() {
            if (order.length === 0) return;
            pos = (pos - 1 + order.length) % order.length;
            flipped = false;
            renderCard();
        }

        nextBtn.addEventListener('click', goNext);
        prevBtn.addEventListener('click', goPrev);

        document.getElementById('shuffleBtn').addEventListener('click', () => {
            for (let i = order.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [order[i], order[j]] = [order[j], order[i]];
            }
            pos = 0;
            flipped = false;
            renderCard();
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            order = DATA.map((_, i) => i).filter(i => matchesSearch(i, search.value));
            pos = 0;
            flipped = false;
            renderCard();
        });

        function matchesSearch(i, q) {
            if (!q) return true;
            q = q.trim().toLowerCase();
            const [word, , , khmer] = DATA[i];
            return word.toLowerCase().includes(q) || khmer.includes(q);
        }

        search.addEventListener('input', () => {
            const q = search.value;
            order = DATA.map((_, i) => i).filter(i => matchesSearch(i, q));
            pos = 0;
            flipped = false;
            renderCard();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') goNext();
            else if (e.key === 'ArrowLeft') goPrev();
            else if (e.key === ' ') {
                e.preventDefault();
                if (order.length === 0) return;
                flipped = !flipped;
                const c = stage.querySelector('.card');
                if (c) c.classList.toggle('flipped');
            }
        });

        renderCard();
    </script>
</body>

</html>
