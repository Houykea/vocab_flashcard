<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Flashcards</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{
    --paper:#F6F1E4;
    --ink:#22271F;
    --ink-soft:#5C5A4E;
    --line:#C9BFA4;
    --gold:#B8862E;
    --gold-dark:#7C5A1E;
    --teal:#1F4B44;
    --teal-light:#E4EFEA;
    --coral:#B54A31;
    --card-bg:#FFFCF4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:'Georgia','Times New Roman',serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 48px;
  }
  .khmer{
    font-family:'Khmer OS','Noto Sans Khmer','Khmer UI',sans-serif;
  }
  h1{
    font-size:22px;
    font-weight:normal;
    letter-spacing:0.5px;
    margin:0 0 2px;
    text-align:center;
  }
  .subtitle{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:20px;
    text-align:center;
  }
  #studyView{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .topbar{
    width:100%;
    max-width:520px;
    display:flex;
    gap:8px;
    margin-bottom:14px;
    font-family:system-ui,-apple-system,sans-serif;
  }git 
  #search{
    flex:1;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--card-bg);
    font-size:13px;
    color:var(--ink);
  }
  #search:focus{outline:1px solid var(--gold);}
  .icon-btn{
    padding:8px 12px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--card-bg);
    font-size:13px;
    font-family:system-ui,-apple-system,sans-serif;
    color:var(--ink);
    cursor:pointer;
  }
  .icon-btn:hover{border-color:var(--gold);}
  .deck-wrap{
    position:relative;
    width:100%;
    max-width:520px;
  }
  .stage{
    position:relative;
    width:100%;
    max-width:520px;
    height:340px;
    perspective:1400px;
  }
  .card{
    position:absolute;
    inset:0;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform 0.5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card-bg);
    box-shadow:0 1px 0 var(--line), 0 6px 16px rgba(70,60,30,0.08);
    display:flex;
    flex-direction:column;
    padding:24px 28px;
  }
  .face::before{
    content:"";
    position:absolute;
    top:14px; left:14px; right:14px; bottom:14px;
    border:1px solid var(--line);
    border-radius:6px;
    pointer-events:none;
  }
  .front{
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .back{
    transform:rotateY(180deg);
    justify-content:flex-start;
    overflow-y:auto;
    font-size:14px;
  }
  .eyebrow{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold-dark);
    margin-bottom:14px;
  }
  .headword{
    font-size:40px;
    line-height:1.15;
    color:var(--ink);
  }
  .hint{
    margin-top:16px;
    font-family:system-ui,-apple-system,sans-serif;
    font-size:12px;
    color:var(--ink-soft);
  }
  .row1{
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:4px;
  }
  .back .headword-small{
    font-size:22px;
    color:var(--ink);
  }
  .pos{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:11px;
    font-style:normal;
    padding:2px 8px;
    border-radius:10px;
    background:var(--teal-light);
    color:var(--teal);
    letter-spacing:0.3px;
  }
  .syn{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .khmer-line{
    font-size:19px;
    color:var(--coral);
    margin:6px 0 10px;
  }
  .divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:4px 0 8px;
  }
  .ex-label{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:10.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .ex{
    font-size:14.5px;
    line-height:1.45;
    margin:0 0 6px;
    color:var(--ink);
  }
  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    max-width:520px;
    margin-top:18px;
    font-family:system-ui,-apple-system,sans-serif;
  }
  .nav-btn{
    padding:9px 16px;
    border:1px solid var(--line);
    border-radius:5px;
    background:var(--card-bg);
    color:var(--ink);
    font-size:13px;
    cursor:pointer;
  }
  .nav-btn:hover{border-color:var(--gold);}
  .nav-btn:disabled{opacity:0.4;cursor:default;}
  .counter{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
  }
  .progress-track{
    width:100%;
    max-width:520px;
    height:3px;
    background:var(--line);
    border-radius:2px;
    margin-top:14px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--gold);
    width:0%;
    transition:width 0.3s ease;
  }
  .empty{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    padding:60px 20px;
  }
  .catnav{
    width:100%;
    max-width:520px;
    display:flex;
    gap:8px;
    margin-bottom:14px;
    font-family:system-ui,-apple-system,sans-serif;
    justify-content:center;
  }
  .catnav-btn{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:5px 12px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--card-bg);
    font-size:13px;
    cursor:pointer;
    color:var(--ink);
  }
  .catnav-btn:hover{border-color:var(--gold);}
  .catnav-btn.active{border-color:var(--gold); background:#FBF3E1;}
  .catnav-dot{
    width:7px; height:7px; border-radius:50%;
    display:inline-block;
  }
  .dot-mastered{background:var(--teal);}
  .dot-learning{background:var(--gold);}
  .dot-new{background:var(--coral);}
  .catnav-count{
    color:var(--ink-soft);
    font-size:11px;
  }
  .tagrow{
    margin-top:auto;
    padding-top:8px;
    border-top:1px dashed var(--line);
    display:flex;
    justify-content:center;
    gap:8px;
    font-family:system-ui,-apple-system,sans-serif;
  }
  .tag-btn{
    flex:0 0 auto;
    padding:6px 14px;
    font-size:11.5px;
    border-radius:5px;
    border:1px solid var(--line);
    background:var(--card-bg);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .tag-btn:hover{border-color:var(--gold);}
  .tag-btn.on-mastered{background:var(--teal); color:#fff; border-color:var(--teal);}
  .tag-btn.on-learning{background:var(--gold); color:#fff; border-color:var(--gold);}
  .tag-btn.on-new{background:var(--coral); color:#fff; border-color:var(--coral);}
  .list-view{
    width:100%;
    max-width:520px;
  }
  .list-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:system-ui,-apple-system,sans-serif;
    margin-bottom:12px;
  }
  .list-title{
    font-size:15px;
    color:var(--ink);
  }
  .back-btn{
    padding:6px 12px;
    border:1px solid var(--line);
    border-radius:5px;
    background:var(--card-bg);
    font-size:12.5px;
    font-family:system-ui,-apple-system,sans-serif;
    color:var(--ink);
    cursor:pointer;
  }
  .back-btn:hover{border-color:var(--gold);}
  .list-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--card-bg);
    margin-bottom:8px;
    cursor:pointer;
    font-family:system-ui,-apple-system,sans-serif;
  }
  .list-item:hover{border-color:var(--gold);}
  .list-word{
    font-family:'Georgia','Times New Roman',serif;
    font-size:16px;
    color:var(--ink);
  }
  .list-khmer{
    font-size:14px;
    color:var(--ink-soft);
  }
  .list-empty{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    padding:40px 20px;
    border:1px dashed var(--line);
    border-radius:8px;
  }
</style>
</head>
<body>

<h1>Vocabulary Flashcards</h1>
<div class="subtitle khmer">អក្សរាវលី &nbsp;·&nbsp; tap a card to flip &nbsp;·&nbsp; <span id="totalCount">75</span> words</div>

<div class="catnav" id="catnav">
  <button class="catnav-btn" data-cat="mastered"><span class="catnav-dot dot-mastered"></span>Mastered <span class="catnav-count" id="count-mastered">0</span></button>
  <button class="catnav-btn" data-cat="learning"><span class="catnav-dot dot-learning"></span>Learning <span class="catnav-count" id="count-learning">0</span></button>
  <button class="catnav-btn" data-cat="new"><span class="catnav-dot dot-new"></span>New <span class="catnav-count" id="count-new">0</span></button>
</div>

<div id="studyView">
  <div class="topbar">
    <input type="text" id="search" placeholder="Search a word...">
    <button class="icon-btn" id="shuffleBtn">Shuffle</button>
    <button class="icon-btn" id="resetBtn">Reset order</button>
  </div>

  <div class="deck-wrap">
    <div class="stage" id="stage"></div>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn">&larr; Previous</button>
    <div class="counter" id="counter">1 / 75</div>
    <button class="nav-btn" id="nextBtn">Next &rarr;</button>
  </div>
</div>

<div class="list-view" id="listViewContainer" style="display:none;">
  <div class="list-header">
    <div class="list-title" id="listTitle">Category</div>
    <button class="back-btn" id="backToStudyBtn">&larr; Back to flashcards</button>
  </div>
  <div id="listItems"></div>
</div>

<script>

];

let order = DATA.map((_,i)=>i);
let pos = 0;
let flipped = false;
let categories = {};
let view = 'study';
let activeListCat = null;

const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const progressFill = document.getElementById('progressFill');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const search = document.getElementById('search');
const studyView = document.getElementById('studyView');
const listViewContainer = document.getElementById('listViewContainer');
const listTitle = document.getElementById('listTitle');
const listItems = document.getElementById('listItems');
document.getElementById('totalCount').textContent = DATA.length;

const CAT_LABELS = {mastered:'Mastered', learning:'Learning', new:'New'};

async function loadCategories(){
  try{
    const res = await window.storage.get('word-categories', false);
    categories = res && res.value ? JSON.parse(res.value) : {};
  }catch(err){
    categories = {};
  }
  renderCounts();
  renderCard();
}

async function saveCategories(){
  try{
    await window.storage.set('word-categories', JSON.stringify(categories), false);
  }catch(err){
    console.error('Could not save category', err);
  }
}

function setCategory(idx, cat){
  if(categories[idx] === cat){
    delete categories[idx];
  }else{
    categories[idx] = cat;
  }
  saveCategories();
  renderCounts();
  renderCard();
  if(view === 'list') renderList(activeListCat);
}

function renderCounts(){
  ['mastered','learning','new'].forEach(cat=>{
    const n = Object.values(categories).filter(c => c === cat).length;
    document.getElementById('count-'+cat).textContent = n;
  });
}

function renderCard(){
  stage.innerHTML = '';
  if(order.length === 0){
    stage.innerHTML = '<div class="empty">No words match your search.</div>';
    counter.textContent = '0 / 0';
    progressFill.style.width = '0%';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }
  prevBtn.disabled = false;
  nextBtn.disabled = false;
  const idx = order[pos];
  const [word,posTag,syn,khmer,ex1,ex2] = DATA[idx];
  const currentCat = categories[idx];

  const card = document.createElement('div');
  card.className = 'card' + (flipped ? ' flipped' : '');
  card.innerHTML = `
    <div class="face front">
      <div class="eyebrow">tap to reveal</div>
      <div class="headword">${word}</div>
      <div class="hint">part of speech &middot; synonym &middot; Khmer &middot; examples</div>
    </div>
    <div class="face back">
      <div class="row1">
        <span class="headword-small">${word}</span>
        <span class="pos">${posTag}</span>
      </div>
      <div class="syn">synonym: ${syn}</div>
      <div class="khmer-line khmer">${khmer}</div>
      <hr class="divider">
      <div class="ex-label">examples</div>
      <p class="ex">${ex1}</p>
      <p class="ex">${ex2}</p>
      <div class="tagrow">
        <button class="tag-btn${currentCat==='mastered' ? ' on-mastered' : ''}" data-tag="mastered">Mastered</button>
        <button class="tag-btn${currentCat==='learning' ? ' on-learning' : ''}" data-tag="learning">Learning</button>
        <button class="tag-btn${currentCat==='new' ? ' on-new' : ''}" data-tag="new">New</button>
      </div>
    </div>
  `;
  card.addEventListener('click', (e)=>{
    if(e.target.closest('.tag-btn')) return;
    flipped = !flipped;
    card.classList.toggle('flipped');
  });
  card.querySelectorAll('.tag-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      setCategory(idx, btn.dataset.tag);
    });
  });
  stage.appendChild(card);

  counter.textContent = (pos+1) + ' / ' + order.length;
  progressFill.style.width = ((pos+1)/order.length*100) + '%';
}

function goNext(){
  if(order.length === 0) return;
  pos = (pos+1) % order.length;
  flipped = false;
  renderCard();
}
function goPrev(){
  if(order.length === 0) return;
  pos = (pos-1+order.length) % order.length;
  flipped = false;
  renderCard();
}

nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);

document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  for(let i=order.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [order[i],order[j]] = [order[j],order[i]];
  }
  pos = 0;
  flipped = false;
  renderCard();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  order = DATA.map((_,i)=>i).filter(i => matchesSearch(i, search.value));
  pos = 0;
  flipped = false;
  renderCard();
});

function matchesSearch(i, q){
  if(!q) return true;
  q = q.trim().toLowerCase();
  const [word,,,khmer] = DATA[i];
  return word.toLowerCase().includes(q) || khmer.includes(q);
}

search.addEventListener('input', ()=>{
  const q = search.value;
  order = DATA.map((_,i)=>i).filter(i => matchesSearch(i,q));
  pos = 0;
  flipped = false;
  renderCard();
});

document.addEventListener('keydown', (e)=>{
  if(view !== 'study') return;
  if(e.key === 'ArrowRight') goNext();
  else if(e.key === 'ArrowLeft') goPrev();
  else if(e.key === ' '){
    e.preventDefault();
    if(order.length===0) return;
    flipped = !flipped;
    const c = stage.querySelector('.card');
    if(c) c.classList.toggle('flipped');
  }
});

function showStudyView(){
  view = 'study';
  studyView.style.display = '';
  listViewContainer.style.display = 'none';
  document.querySelectorAll('.catnav-btn').forEach(b => b.classList.remove('active'));
  renderCard();
}

function showListView(cat){
  view = 'list';
  activeListCat = cat;
  studyView.style.display = 'none';
  listViewContainer.style.display = '';
  document.querySelectorAll('.catnav-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  renderList(cat);
}

function renderList(cat){
  listTitle.textContent = CAT_LABELS[cat] + ' words';
  const idxs = DATA.map((_,i)=>i).filter(i => categories[i] === cat);
  if(idxs.length === 0){
    listItems.innerHTML = '<div class="list-empty">No words saved in ' + CAT_LABELS[cat] + ' yet.</div>';
    return;
  }
  listItems.innerHTML = '';
  idxs.forEach(idx=>{
    const [word,,,khmer] = DATA[idx];
    const item = document.createElement('div');
    item.className = 'list-item';
    item.innerHTML = `<span class="list-word">${word}</span><span class="list-khmer khmer">${khmer}</span>`;
    item.addEventListener('click', ()=>{
      order = DATA.map((_,i)=>i);
      search.value = '';
      pos = order.indexOf(idx);
      flipped = false;
      showStudyView();
    });
    listItems.appendChild(item);
  });
}

document.querySelectorAll('.catnav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(view === 'list' && activeListCat === btn.dataset.cat){
      showStudyView();
    }else{
      showListView(btn.dataset.cat);
    }
  });
});

document.getElementById('backToStudyBtn').addEventListener('click', showStudyView);

loadCategories();
</script>
